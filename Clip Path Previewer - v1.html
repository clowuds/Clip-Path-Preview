<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clip-path previewer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          rgba(15, 15, 17, 1);
  --surface:     rgba(24, 24, 28, 1);
  --surface2:    rgba(34, 34, 40, 1);
  --surface3:    rgba(42, 42, 50, 1);
  --border:      rgba(46, 46, 56, 1);
  --text:        rgba(232, 232, 240, 1);
  --muted:       rgba(107, 107, 128, 1);
  --dim:         rgba(68, 68, 90, 1);
  --accent:      rgba(124, 106, 247, 1);
  --accent-dim:  rgba(30, 26, 58, 1);
  --success:     rgba(74, 222, 128, 1);
  --danger:      rgba(248, 113, 113, 1);
  --check:       rgba(255, 255, 255, 0.024);
  --grad-a:      rgba(124, 106, 247, 1);
  --grad-b:      rgba(192, 132, 252, 1);
  --grad-c:      rgba(244, 114, 182, 1);
  --syn-prop:    rgba(147, 197, 253, 1);
  --syn-val:     rgba(134, 239, 172, 1);
  --mono: 'Courier New', monospace;
  --sans: system-ui, -apple-system, sans-serif;
}

body {
  -webkit-tap-highlight-color: transparent;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 380px;
  grid-template-rows: 52px 1fr;
}

/* ── Header ── */
header {
  grid-column: 1 / -1;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
}
header h1 { font-size: 14px; font-weight: 600; }
.header-links {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-link {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  transition: all .15s;
  font-family: var(--sans);
}
.header-link:hover { color: var(--text); border-color: var(--dim); }
.header-link.support { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.header-link.support:hover { background: rgba(124, 106, 247, 0.2); }
.badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .05em;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid var(--accent);
}

/* ── Preview ── */
#preview-pane {
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 32px;
  position: relative;
  overflow: hidden;
}
#preview-pane::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(45deg, var(--check) 25%, transparent 25%),
    linear-gradient(-45deg, var(--check) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--check) 75%),
    linear-gradient(-45deg, transparent 75%, var(--check) 75%);
  background-size: 18px 18px;
  background-position: 0 0, 0 9px, 9px -9px, -9px 0;
}
#preview-box {
  width: 260px;
  height: 260px;
  background: linear-gradient(135deg, var(--grad-a), var(--grad-b) 50%, var(--grad-c));
  transition: clip-path .2s ease;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}
#preview-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

.preview-controls {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 8px;
}
.ctrl-btn {
  font-size: 12px;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  font-family: var(--sans);
}
.ctrl-btn:hover, .ctrl-btn.active { color: var(--text); border-color: var(--accent); }
.ctrl-btn.active { background: var(--accent-dim); color: var(--accent); }

.size-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 10px;
}
.size-row label { font-size: 11px; color: var(--muted); }
.size-row input[type=number] {
  width: 64px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
  outline: none;
}
.size-row input[type=number]:focus { border-color: var(--accent); }

/* ── Panel ── */
#panel {
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.section {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

/* ── Presets ── */
#preset-tabs { display: flex; flex-wrap: wrap; gap: 5px; }
.preset-btn {
  font-size: 11.5px;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  font-family: var(--sans);
}
.preset-btn:hover { color: var(--text); border-color: var(--dim); }
.preset-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* ── Code editor ── */
#code-area-wrap {
  position: relative;
}
#code-area {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
  resize: none;
  outline: none;
  line-height: 1.65;
  min-height: 70px;
  max-height: 40lh;
  overflow-y: auto;
  display: block;
  transition: border-color .15s;
}
#code-area:focus { border-color: var(--accent); }
#code-area-resizer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 10px;
  cursor: ns-resize;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 0 0 8px 8px;
  opacity: 0;
  transition: opacity .15s;
}
#code-area-wrap:hover #code-area-resizer,
#code-area-resizer.dragging {
  opacity: 1;
}
#code-area-resizer svg {
  pointer-events: none;
}
#parse-error {
  font-size: 11px;
  color: var(--danger);
  margin-top: 6px;
  min-height: 16px;
}

/* ── Sliders ── */
#sliders-section {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#sliders-section .section {
  flex: 1;
  overflow-y: auto;
  border-bottom: none;
}

#sliders-inner {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.slider-block {
  background: var(--surface2);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  border: 1px solid transparent;
  transition: border-color .15s;
}
.slider-block:hover { border-color: var(--border); }
.slider-block.editing { border-color: var(--accent); }

.slider-top {
  display: flex;
  align-items: center;
  gap: 6px;
}
.token-keyword {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 1px 6px;
  border-radius: 4px;
  flex-shrink: 0;
}
.token-context {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.slider-val-display {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  min-width: 44px;
  text-align: right;
}

.slider-row-inner {
  display: flex;
  align-items: center;
  gap: 8px;
}
input[type=range] {
  -webkit-appearance: none;
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

.range-bounds {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--dim);
  font-family: var(--mono);
}

/* range editor */
.range-editor {
  display: none;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.range-editor.open { display: flex; }
.range-editor label { font-size: 10px; color: var(--muted); }
.range-editor input[type=number] {
  width: 60px;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  padding: 3px 6px;
  font-size: 11px;
  font-family: var(--mono);
  outline: none;
}
.range-editor input[type=number]:focus { border-color: var(--accent); }
.edit-range-btn {
  font-size: 10px;
  color: var(--dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  margin-left: auto;
  font-family: var(--sans);
  transition: color .15s;
}
.edit-range-btn:hover { color: var(--muted); }

/* add variable */
#add-var-wrap {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#add-var-form {
  display: flex;
  gap: 6px;
}
#add-var-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 10px;
  font-size: 12px;
  font-family: var(--mono);
  outline: none;
  transition: border-color .15s;
}
#add-var-input:focus { border-color: var(--accent); }
#add-var-input::placeholder { color: var(--dim); }
#add-var-btn {
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--sans);
  transition: background .15s;
}
#add-var-btn:hover { background: rgba(124, 106, 247, 0.3); }

/* ── Output / copy ── */
#output-section {
  padding: 14px 18px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
#output-code {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  background: var(--surface2);
  border-radius: 6px;
  padding: 9px 11px;
  word-break: break-all;
  line-height: 1.6;
  margin-bottom: 10px;
}
.oc-prop { color: var(--syn-prop); }
.oc-val  { color: var(--syn-val); }

#copy-btn {
  width: 100%;
  padding: 9px;
  background: var(--accent-dim);
  border: 1px solid var(--accent);
  border-radius: 7px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--sans);
  transition: background .15s;
}
#copy-btn:hover { background: rgba(124, 106, 247, 0.3); }
#copy-btn.copied { color: var(--success); border-color: var(--success); background: rgba(74, 222, 128, 0.1); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>Clip Path Previewer</h1>
  <span class="badge">v1.2.0</span>
  <div class="header-links">
    <a class="header-link" href="https://github.com/clowuds" target="_blank" rel="noopener" title="GitHub">

</header>

<main id="preview-pane">
  <div id="preview-box"></div>

  <div class="preview-controls">
    <button class="ctrl-btn active" id="btn-gradient">gradient</button>
    <button class="ctrl-btn" id="btn-photo">photo</button>
    <button class="ctrl-btn" id="btn-solid">solid</button>
  </div>

  <div class="size-row">
    <label>W</label>
    <input type="number" id="w-input" value="260" min="40" max="600">
    <label>H</label>
    <input type="number" id="h-input" value="260" min="40" max="600">
    <label style="color:var(--dim)">px</label>
  </div>
</main>

<aside id="panel">

  <!-- Presets -->
  <div class="section">
    <div class="section-title">Presets</div>
    <div id="preset-tabs"></div>
  </div>

  <!-- Editor -->
  <div class="section">
    <div class="section-title">Value</div>
    <div id="code-area-wrap">
      <textarea id="code-area" spellcheck="false" rows="3"></textarea>
      <div id="code-area-resizer">
        <svg width="24" height="4" viewBox="0 0 24 4" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="24" height="1.5" rx="1" fill="var(--dim)"/>
          <rect x="0" y="2.5" width="24" height="1.5" rx="1" fill="var(--dim)"/>
        </svg>
      </div>
    </div>
    <div id="parse-error"></div>
  </div>

  <!-- Add variable -->
  <div id="add-var-wrap">
    <div class="section-title" style="margin-bottom:8px">Add variable</div>
    <div id="add-var-form">
      <input id="add-var-input" type="text" placeholder="e.g.  30%  or  1px  or  45deg">
      <button id="add-var-btn">Insert</button>
    </div>
  </div>

  <!-- Sliders -->
  <div id="sliders-section">
    <div class="section">
      <div class="section-title">Parameters — every numeric token</div>
      <div id="sliders-inner"></div>
    </div>
  </div>

  <!-- Output -->
  <div id="output-section">
    <div id="output-code"></div>
    <button id="copy-btn">Copy CSS</button>
  </div>

</aside>

<script>
// ── Presets ──────────────────────────────────────────────────────────────────
const PRESETS = [
  { name: 'heart',
    value: 'shape(from 50% 90%, line to 90% 50%, arc to 50% 10% of 1%, arc to 10% 50% of 1%)' },
  { name: 'circle',     value: 'circle(50% at 50% 50%)' },
  { name: 'ellipse',    value: 'ellipse(50% 40% at 50% 50%)' },
  { name: 'inset',      value: 'inset(10% 10% 10% 10% round 16%)' },
  { name: 'triangle',   value: 'polygon(50% 0%, 0% 100%, 100% 100%)' },
  { name: 'star',
    value: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)' },
  { name: 'hexagon',    value: 'polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)' },
  { name: 'arrow',
    value: 'polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%)' },
  { name: 'diamond',    value: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' },
  { name: 'trapezoid',  value: 'polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%)' },
  { name: 'notch',      value: 'polygon(0% 0%, 85% 0%, 100% 15%, 100% 100%, 0% 100%)' },
  { name: 'cross',
    value: 'polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%)' },
  { name: 'path()',     value: "path('M 130 0 L 260 260 L 0 260 Z')" },
];

// ── Token parser ──────────────────────────────────────────────────────────────
// Finds every numeric token (with optional unit) and labels it from context.

// CSS keywords that can appear before/after numbers — used for labelling
const KEYWORDS = [
  'from','to','line','arc','curve','smooth','of',
  'circle','ellipse','polygon','inset','path','shape',
  'at','round','closest-side','farthest-side',
];

function parseTokens(str) {
  // Match: optional sign, digits, optional decimal, optional unit
  // Capture: [fullMatch, numPart, unit]
  const re = /(-?\d+(?:\.\d+)?)(deg|grad|rad|turn|px|em|rem|%|vw|vh|vmin|vmax)?/g;
  const tokens = [];
  let m;
  while ((m = re.exec(str)) !== null) {
    // skip if the char immediately before is a letter (part of a word like "50deg" preceded by a keyword)
    // we want the number itself, not embedded in identifiers
    const before = str.slice(0, m.index);
    const after  = str.slice(m.index + m[0].length);
    // skip if directly attached to a letter before (e.g. inside a word)
    if (/[a-zA-Z]$/.test(before)) continue;

    // derive a label from surrounding keyword context
    const label = deriveLabel(before, after, tokens.length);

    tokens.push({
      index:   m.index,
      length:  m[0].length,
      raw:     m[0],
      num:     parseFloat(m[1]),
      unit:    m[2] || '',
      label,
      // slider range defaults depend on unit
      min:     defaultMin(m[2]),
      max:     defaultMax(m[2]),
    });
  }
  return tokens;
}

function deriveLabel(before, after, idx) {
  // look backwards for the nearest keyword
  const kw = findNearestKeyword(before);
  // look at what comes after the number (the unit gives type info)
  // also check position index for x/y alternation in polygons
  if (!kw) return `value ${idx + 1}`;
  // shape() specific
  if (kw === 'from')  return idx % 2 === 0 ? 'from X' : 'from Y';
  if (kw === 'to')    return idx % 2 === 0 ? 'to X'   : 'to Y';
  if (kw === 'of')    return 'arc radius';
  if (kw === 'at')    return idx % 2 === 0 ? 'center X' : 'center Y';
  if (kw === 'round') return 'corner radius';
  if (kw === 'circle')  return 'radius';
  if (kw === 'ellipse') return idx % 2 === 0 ? 'rx' : 'ry';
  if (kw === 'inset') {
    const labels = ['top','right','bottom','left'];
    return labels[idx % 4] || `inset ${idx}`;
  }
  if (kw === 'polygon') {
    const axis = idx % 2 === 0 ? 'X' : 'Y';
    return `point ${Math.floor(idx/2)+1} ${axis}`;
  }
  return kw + ' ' + (idx + 1);
}

function findNearestKeyword(before) {
  // scan backwards through the string looking for a keyword
  const cleaned = before.replace(/[,()]/g, ' ');
  const words = cleaned.trim().split(/\s+/).filter(Boolean);
  for (let i = words.length - 1; i >= 0; i--) {
    const w = words[i].toLowerCase();
    if (KEYWORDS.includes(w)) return w;
  }
  return null;
}

function defaultMin(unit) {
  if (unit === '%')   return 0;
  if (unit === 'deg') return 0;
  if (unit === 'px')  return 0;
  return -200;
}
function defaultMax(unit) {
  if (unit === '%')   return 100;
  if (unit === 'deg') return 360;
  if (unit === 'px')  return 500;
  return 200;
}

// Rebuild the string with updated token values, then re-parse positions
// so subsequent slider moves reference the correct offsets in the new string.
function rebuildString(str, tokens) {
  let result = '';
  let cursor = 0;
  for (const t of tokens) {
    result += str.slice(cursor, t.index);
    const numStr = String(Math.round(t.num * 100) / 100);
    t._newIndex = result.length;          // track where this token lands
    result += numStr + t.unit;
    cursor = t.index + t.length;
  }
  result += str.slice(cursor);

  // Patch each token's index/length to match its position in the rebuilt string
  for (const t of tokens) {
    t.index  = t._newIndex;
    t.length = String(t.num).length + t.unit.length;
    delete t._newIndex;
  }

  return result;
}

// ── State ─────────────────────────────────────────────────────────────────────
let currentValue = PRESETS[0].value;
let tokens = [];
let bgMode = 'gradient'; // 'gradient' | 'photo' | 'solid'

const box       = document.getElementById('preview-box');
const codeArea  = document.getElementById('code-area');
const slidersEl = document.getElementById('sliders-inner');
const outputEl  = document.getElementById('output-code');
const copyBtn   = document.getElementById('copy-btn');
const errEl     = document.getElementById('parse-error');
const wInput    = document.getElementById('w-input');
const hInput    = document.getElementById('h-input');

// ── Apply & render ────────────────────────────────────────────────────────────
function apply(val, fromSlider = false) {
  box.style.clipPath = val;
  outputEl.innerHTML =
    `<span class="oc-prop">clip-path</span>: <span class="oc-val">${esc(val)}</span>;`;

  // only re-parse + rebuild sliders when NOT coming from a slider (avoid flicker)
  if (!fromSlider) {
    tokens = parseTokens(val);
    buildSliders();
  }

  // update textarea unless we're typing in it
  if (!fromSlider) codeArea.value = val;
  errEl.textContent = '';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Build sliders ─────────────────────────────────────────────────────────────
function buildSliders() {
  slidersEl.innerHTML = '';
  if (tokens.length === 0) {
    slidersEl.innerHTML = '<p style="font-size:12px;color:var(--muted);padding:8px 0">No numeric tokens found.</p>';
    return;
  }

  tokens.forEach((tok, i) => {
    const block = document.createElement('div');
    block.className = 'slider-block';
    block.innerHTML = `
      <div class="slider-top">
        <span class="token-keyword">${esc(tok.unit || '#')}</span>
        <span class="token-context">${esc(tok.label)}</span>
        <span class="slider-val-display" id="val-${i}">${tok.num}${tok.unit}</span>
        <button class="edit-range-btn" title="edit range" data-idx="${i}">range ▾</button>
      </div>
      <div class="slider-row-inner">
        <input type="range"
          id="sr-${i}"
          min="${tok.min}" max="${tok.max}"
          step="${tok.unit === 'px' ? 1 : 0.05}"
          value="${Math.min(tok.max, Math.max(tok.min, tok.num))}">
      </div>
      <div class="range-bounds">
        <span id="lb-${i}">${tok.min}${tok.unit}</span>
        <span id="ub-${i}">${tok.max}${tok.unit}</span>
      </div>
      <div class="range-editor" id="re-${i}">
        <label>min</label>
        <input type="number" id="rmin-${i}" value="${tok.min}">
        <label>max</label>
        <input type="number" id="rmax-${i}" value="${tok.max}">
      </div>
    `;
    slidersEl.appendChild(block);

    // slider input
    document.getElementById(`sr-${i}`).addEventListener('input', e => {
      const v = Math.round(parseFloat(e.target.value) * 100) / 100;
      tokens[i].num = v;
      document.getElementById(`val-${i}`).textContent = v + tokens[i].unit;
      currentValue = rebuildString(currentValue, tokens);
      codeArea.value = currentValue;
      apply(currentValue, true);
      block.classList.add('editing');
      clearTimeout(block._editTimer);
      block._editTimer = setTimeout(() => block.classList.remove('editing'), 600);
    });

    // toggle range editor
    block.querySelector('.edit-range-btn').addEventListener('click', () => {
      const re = document.getElementById(`re-${i}`);
      re.classList.toggle('open');
    });

    // range min/max
    document.getElementById(`rmin-${i}`).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) {
        tokens[i].min = v;
        const sl = document.getElementById(`sr-${i}`);
        sl.min = v;
        document.getElementById(`lb-${i}`).textContent = v + tokens[i].unit;
      }
    });
    document.getElementById(`rmax-${i}`).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) {
        tokens[i].max = v;
        const sl = document.getElementById(`sr-${i}`);
        sl.max = v;
        document.getElementById(`ub-${i}`).textContent = v + tokens[i].unit;
      }
    });
  });
}

// ── Textarea custom resize handle ─────────────────────────────────────────────
(function() {
  const resizer = document.getElementById('code-area-resizer');
  let startY, startH;

  const maxH = parseFloat(getComputedStyle(codeArea).maxHeight) || Infinity;

  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    startY = e.clientY;
    startH = codeArea.offsetHeight;
    resizer.classList.add('dragging');

    function onMove(e) {
      const newH = Math.min(maxH, Math.max(70, startH + e.clientY - startY));
      codeArea.style.height = newH + 'px';
    }
    function onUp() {
      resizer.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  resizer.addEventListener('touchstart', e => {
    e.preventDefault();
    startY = e.touches[0].clientY;
    startH = codeArea.offsetHeight;
    resizer.classList.add('dragging');

    function onMove(e) {
      const newH = Math.min(maxH, Math.max(70, startH + e.touches[0].clientY - startY));
      codeArea.style.height = newH + 'px';
    }
    function onUp() {
      resizer.classList.remove('dragging');
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }, { passive: false });
})();

// ── Code area ─────────────────────────────────────────────────────────────────
codeArea.addEventListener('input', () => {
  const v = codeArea.value;
  currentValue = v;
  // deactivate preset badge
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  apply(v);
});

// ── Add variable ──────────────────────────────────────────────────────────────
document.getElementById('add-var-btn').addEventListener('click', insertVar);
document.getElementById('add-var-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') insertVar();
});

function insertVar() {
  const raw = document.getElementById('add-var-input').value.trim();
  if (!raw) return;
  // append to the current value at the cursor or at end
  // For shape() we need to add inside the parens; for others, append
  // Simple approach: append before the last ')'
  let val = currentValue;
  const lastParen = val.lastIndexOf(')');
  if (lastParen !== -1) {
    val = val.slice(0, lastParen) + ', ' + raw + val.slice(lastParen);
  } else {
    val = val + ' ' + raw;
  }
  currentValue = val;
  codeArea.value = val;
  document.getElementById('add-var-input').value = '';
  apply(val);
}

// ── Presets ───────────────────────────────────────────────────────────────────
const tabsEl = document.getElementById('preset-tabs');
PRESETS.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'preset-btn' + (i === 0 ? ' active' : '');
  btn.textContent = p.name;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentValue = p.value;
    apply(p.value);
  });
  tabsEl.appendChild(btn);
});

// ── BG toggle ─────────────────────────────────────────────────────────────────
function setBg(mode) {
  bgMode = mode;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');
  box.innerHTML = '';
  const cs = getComputedStyle(document.documentElement);
  const ga = cs.getPropertyValue('--grad-a').trim();
  const gb = cs.getPropertyValue('--grad-b').trim();
  const gc = cs.getPropertyValue('--grad-c').trim();
  if (mode === 'gradient') {
    box.style.background = `linear-gradient(135deg, ${ga}, ${gb} 50%, ${gc})`;
  } else if (mode === 'photo') {
    box.style.background = 'none';
    const img = document.createElement('img');
    img.src = 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80';
    img.alt = 'mountain landscape';
    box.appendChild(img);
  } else {
    box.style.background = ga;
  }
  apply(currentValue, true);
}
document.getElementById('btn-gradient').addEventListener('click', () => setBg('gradient'));
document.getElementById('btn-photo').addEventListener('click',    () => setBg('photo'));
document.getElementById('btn-solid').addEventListener('click',    () => setBg('solid'));

// ── Size ──────────────────────────────────────────────────────────────────────
wInput.addEventListener('input', () => { box.style.width  = wInput.value + 'px'; });
hInput.addEventListener('input', () => { box.style.height = hInput.value + 'px'; });

// ── Copy ──────────────────────────────────────────────────────────────────────
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(`clip-path: ${currentValue};`).then(() => {
    copyBtn.textContent = 'Copied!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy CSS';
      copyBtn.classList.remove('copied');
    }, 1800);
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
setBg('gradient');
apply(PRESETS[0].value);
</script>
</body>
</html>

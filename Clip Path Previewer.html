<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clip-path previewer</title>
<script src="clip-path.js" defer></script>
<link rel="stylesheet" href="clip-path.css">
</head>
<body>

<header>
  <h1>Clip Path Previewer</h1>
  <span class="badge">v1.6.0</span>
  <div class="header-links">
    <a class="header-link" href="https://github.com/clowuds" target="_blank" rel="noopener" title="GitHub">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
      </svg>
      GitHub
    </a>
    <a class="header-link support" href="https://ko-fi.com/clowuds" target="_blank" rel="noopener" title="Support on Ko-fi">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402C1 4.074 3.062 2 5.68 2c1.726 0 3.363.928 4.32 2.406C11.957 2.928 13.594 2 15.32 2 17.938 2 20 4.074 20 7.191c0 4.105-5.37 8.863-11 14.402z"/>
      </svg>
      Support me
    </a>
  </div>
</header>

<main id="preview-pane">
  <div id="preview-box-wrap">
    <div id="preview-box"></div>
    <div id="vertex-overlay"></div>
  </div>

  <div class="preview-controls">
    <button class="ctrl-btn active" id="btn-gradient">gradient</button>
    <button class="ctrl-btn" id="btn-photo">photo</button>
    <button class="ctrl-btn" id="btn-solid">solid</button>
  </div>

  <div class="size-row">
    <label>W</label>
    <input type="number" id="w-input" value="260" min="40" max="600">
    <label>H</label>
    <input type="number" id="h-input" value="260" min="40" max="600">
    <label style="color:var(--dim)">px</label>
  </div>
</main>

<aside id="panel">

  <div id="panel-scroll">

    <!-- Presets -->
    <div class="section">
      <div class="section-title">Presets</div>
      <div id="preset-tabs"></div>
    </div>

    <!-- Editor -->
    <div class="section">
      <div class="section-title">Value</div>
      <div id="code-area-wrap">
        <textarea id="code-area" spellcheck="false" rows="3"></textarea>
        <div id="code-area-resizer">
          <svg width="24" height="4" viewBox="0 0 24 4" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="24" height="1.5" rx="1" fill="var(--dim)"/>
            <rect x="0" y="2.5" width="24" height="1.5" rx="1" fill="var(--dim)"/>
          </svg>
        </div>
      </div>
      <div id="parse-error"></div>
    </div>

    <!-- Add variable -->
    <div id="add-var-wrap">
      <div class="section-title" style="margin-bottom:8px">Add variable</div>
      <div id="add-var-form">
        <input id="add-var-input" type="text" placeholder="e.g.  30%  or  1px  or  45deg">
        <button id="add-var-btn">Insert</button>
      </div>
    </div>

    <!-- Sliders -->
    <div id="sliders-section">
      <div class="section">
        <div class="section-title">Parameters — every numeric token</div>
        <div id="sliders-inner"></div>
      </div>
    </div>

  </div><!-- /#panel-scroll -->

  <!-- Output — pinned to bottom -->
  <div id="output-section">
    <div id="output-code"></div>
    <button id="copy-btn">Copy CSS</button>
  </div>

</aside>

<script src="clip-path.js" defer></script>

</body>
</html>
